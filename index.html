    <title>Qubit Playground</title>
    <script>
      // pick the theme before the first paint (the full palette is applied by src/theme.ts)
      (function () {
        var t = 'dark';
        try {
          var s = localStorage.getItem('qp.theme');
          t = s === 'light' || s === 'dark' ? s : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        document.documentElement.style.background = t === 'light' ? '#f6f3ec' : '#121211';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
